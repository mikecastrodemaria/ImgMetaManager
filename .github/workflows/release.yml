name: Release

# Releases follow the version declared in pyproject.toml. Bump it, write the
# matching CHANGELOG.md section, push to the default branch, and this workflow
# tags the commit and publishes the release.
#
# It is idempotent: a push that touches the changelog without changing the
# version finds the release already published and stops before doing anything.
# The Actions tab can also run it by hand, with an explicit version.
on:
  push:
    branches: ["**"]
    paths:
      - "pyproject.toml"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    # Only the default branch may publish, so a feature branch cannot ship a release.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version}"

      - name: Stop if the release already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "${TAG} is already published, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version against pyproject.toml
        if: steps.guard.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          wanted = os.environ["VERSION"]
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if declared != wanted:
              raise SystemExit(
                  f"pyproject.toml declares {declared}, the release asks for {wanted}")
          print(f"version {wanted} confirmed")
          PY

      - name: Install and test
        if: steps.guard.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pyflakes imgmetamanager tests
          python -m pytest tests -q

      - name: Build the distributions
        if: steps.guard.outputs.skip == 'false'
        run: |
          python -m pip install build
          python -m build

      - name: Extract the changelog section
        if: steps.guard.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop at the next version heading or at the link definitions.
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |^\[[^\]]+\]:|\Z)"
          match = re.search(pattern, text, re.S | re.M)
          notes = match.group(1).strip() if match else f"Release {version}."
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Publish the release
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # gh creates the tag on the target commit, so the runner needs no git
          # identity and no extra push.
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "ImgMetaManager ${VERSION}" \
            --notes-file release-notes.md \
            dist/*
