[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgmetamanager"
version = "1.1.0"
description = "Read, export and remove image metadata, from a cross-platform Gradio interface or the command line"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mike Castro Demaria" }]
keywords = ["exif", "iptc", "xmp", "metadata", "gradio", "privacy", "images",
            "c2pa", "content-credentials", "provenance", "ai-act", "watermark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "gradio>=5.0,<7.0",
    "pillow>=10.0",
    "piexif>=1.1.3",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]
# AI provenance detection. trustmark pulls torch, which is a large download.
c2pa = ["c2pa-python>=0.30"]
watermark = ["trustmark>=0.7"]
provenance = ["c2pa-python>=0.30", "trustmark>=0.7"]
dev = ["pytest>=7.0", "pyflakes>=3.0", "pillow-heif>=0.16"]

[project.urls]
Homepage = "https://github.com/mikecastrodemaria/ImgMetaManager"
Issues = "https://github.com/mikecastrodemaria/ImgMetaManager/issues"
Changelog = "https://github.com/mikecastrodemaria/ImgMetaManager/blob/main/CHANGELOG.md"

[project.scripts]
imgmetamanager = "imgmetamanager.cli:main"

[project.gui-scripts]
imgmetamanager-gui = "imgmetamanager.cli:main"

[tool.setuptools]
packages = ["imgmetamanager", "imgmetamanager.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
